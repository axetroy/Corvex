<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvex - AI 助手</title>
    <style>
        /* 基础重置，确保不乱 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb; /* 极浅灰背景 */
            color: #111827;
            height: 100vh;
            display: flex;
            overflow: hidden; /* 防止出现页面级滚动条 */
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            flex-shrink: 0; /* 防止侧边栏被挤压 */
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
        }

        .btn-new-chat {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .btn-new-chat:hover {
            background-color: #1d4ed8;
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #9ca3af;
        }

        .empty-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 13px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f9fafb;
            position: relative;
        }

        /* 顶部状态栏 */
        .top-bar {
            height: 60px;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-weight: 600;
            color: #374151;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        /* 中间居中引导区 */
        .center-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-bottom: 120px; /* 为底部输入框留出空间 */
            overflow-y: auto;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        .welcome-subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        /* 快捷标签 */
        .tags-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 10px 20px;
            border-radius: 99px; /* 胶囊形状 */
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .tag:hover {
            border-color: #3b82f6;
            color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 上下文输入框 (小输入框) */
        .context-inputs {
            display: flex;
            gap: 12px;
        }

        .small-input {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #6b7280;
            outline: none;
            transition: border-color 0.2s;
        }

        .small-input:focus {
            border-color: #3b82f6;
        }

        /* 底部大输入框区 */
        .bottom-input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, #f9fafb 70%, transparent);
        }

        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .main-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 15px;
            outline: none;
            color: #111827;
        }

        .main-input::placeholder {
            color: #9ca3af;
        }

        .btn-send {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background-color: #1d4ed8;
        }

        /* 简单的 SVG 图标样式 */
        svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- 左侧侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat">
                <svg width="16" height="16" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                新建会话
            </button>
        </div>
        
        <div class="sidebar-content">
            <svg class="empty-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <p class="empty-text">暂无会话记录</p>
        </div>
    </aside>

    <!-- 右侧主内容 -->
    <main class="main-content">
        
        <!-- 顶部标题 -->
        <header class="top-bar">
            新建会话
        </header>

        <!-- 居中内容区 -->
        <div class="center-stage">
            <h1 class="welcome-title">你好，我是 Corvex</h1>
            <p class="welcome-subtitle">你希望我帮你了解什么？</p>

            <!-- 快捷操作标签 -->
            <div class="tags-container">
                <button class="tag">
                    <svg width="16" height="16" viewBox="0 0 24 24" stroke="#6b7280"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    仓库
                </button>
                <button class="tag">
                    <svg width="16" height="16" viewBox="0 0 24 24" stroke="#6b7280"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    Issue
                </button>
                <button class="tag">
                    <svg width="16" height="16" viewBox="0 0 24 24" stroke="#6b7280"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M6 21V9a9 9 0 0 0 9 9"></path></svg>
                    合并请求
                </button>
            </div>

            <!-- 上下文输入框 -->
            <div class="context-inputs">
                <input type="text" class="small-input" placeholder="项目名称或路径" style="width: 160px;">
                <input type="text" class="small-input" placeholder="分支 (如 main)" style="width: 120px;" disabled>
            </div>
        </div>

        <!-- 底部大输入框区 -->
        <div class="bottom-input-area">
            <div class="input-wrapper">
                <!-- 输入框 -->
                <input type="text" class="main-input" placeholder="你希望 Corvex 帮你了解什么？">
                <!-- 发送按钮 -->
                <button class="btn-send">
                    <svg width="20" height="20" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </main>

</body>
</html>
