server:
  listen: "0.0.0.0:8080"
  read_timeout: 5s
  shutdown_timeout: 30s

gitlab:
  base_url: "https://gitlab.example.com"
  blocked_user_ids: []
  bot_username: "corvex-bot"

storage:
  root: "./data/corvex"
  database: "./data/state/corvex.db"
  retention_days: 90
  audit_retention_days: 365

agent:
  enabled: false
  response_language: "en" # en or zh-CN
  base_url: "https://api.openai.com/v1"
  model: "your-model-name"
  request_timeout: 10m
  session_timeout: 120m
  max_output_tokens: 8192
  daily_token_budget: 0
  mcp_enabled: false
  web_enabled: true
  web_blocked_hosts: []
  skill_paths: []

  # 上下文预算：模型窗口、提示词预算与 SDK 压缩阈值。
  # context_window 是模型的真实窗口；请求超限时先按下面的预算在本地裁剪，
  # 而不是依赖服务端报错。max_input_tokens 为 0 时由窗口减输出预留推导。
  context_window: 131072
  max_input_tokens: 0
  history_token_budget: 24000
  turn_tool_result_bytes: 524288
  compaction_reserve_tokens: 16384
  compaction_keep_recent_tokens: 20000
  summary_enabled: true

review:
  max_files: 100
  max_findings: 30
  max_context_bytes: 2097152
  batch_concurrency: 2

chat:
  history_comments: 20

worker:
  poll_interval: 2s
  event_timeout: 130m

fix:
  enabled: false
  max_patch_bytes: 131072

issue:
  implement_enabled: false
  history_comments: 20
