# 仅填写启动必需项：监听地址、存储路径与 GitLab 连接。
# 模型供应商与模型、上下文预算、工具开关、超时、保留策略、屏蔽主机
# 与用户等都在运维台「设置」页维护，保存在 SQLite，首次保存后即为唯一来源。

server:
  listen: "0.0.0.0:8080"
  read_timeout: 5s
  shutdown_timeout: 30s

storage:
  root: "./data/corvex"
  database: "./data/state/corvex.db"

