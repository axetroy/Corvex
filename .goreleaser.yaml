version: 2

project_name: corvex

builds:
  - id: corvex
    main: ./cmd/corvex
    binary: corvex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - README.zh_CN.md
      - configs/config.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
