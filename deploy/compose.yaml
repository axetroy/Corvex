services:
  corvex:
    image: ghcr.io/axetroy/corvex:${CORVEX_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${CORVEX_MEM_LIMIT:-1g}
    cpus: ${CORVEX_CPUS:-1.0}
    pids_limit: ${CORVEX_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      CORVEX_STORAGE_ROOT: /data/corvex
      CORVEX_DATABASE: /data/corvex/state/corvex.db
    volumes:
      - ../configs/config.yaml:/etc/corvex/config.yaml:ro
      - corvex-data:/data/corvex
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  corvex-data:
